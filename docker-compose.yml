# ---------------------------------------------------------------------------
# DevInsight — full stack.
#   docker compose up -d --build
#   web  → http://localhost:8080
#   api  → http://localhost:8000/docs
#   mlflow → http://localhost:5000
# ---------------------------------------------------------------------------
name: devinsight

services:
  db:
    image: postgres:16-alpine
    container_name: devinsight-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devinsight}
      POSTGRES_DB: ${POSTGRES_DB:-devinsight}
      # Deterministic collation keeps index behaviour identical across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devinsight} -d ${POSTGRES_DB:-devinsight}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [devinsight]

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: devinsight-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env before starting}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-devinsight}:${POSTGRES_PASSWORD:-devinsight}@db:5432/${POSTGRES_DB:-devinsight}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_MAX_RETRIES: ${GITHUB_MAX_RETRIES:-4}
      GITHUB_CACHE_TTL: ${GITHUB_CACHE_TTL:-900}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_ENABLED: ${MLFLOW_TRACKING_ENABLED:-true}
      INGEST_MAX_COMMITS: ${INGEST_MAX_COMMITS:-4000}
      INGEST_MAX_ISSUES: ${INGEST_MAX_ISSUES:-1500}
    volumes:
      # Raw ETL store + trained artefacts survive container replacement.
      - etl_data:/app/data
      - ml_artifacts:/app/ml/artifacts
      - ml_reports:/app/ml/reports
    ports:
      - "8000:8000"
    networks: [devinsight]

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api
    container_name: devinsight-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    networks: [devinsight]

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    container_name: devinsight-mlflow
    restart: unless-stopped
    environment:
      MLFLOW_TRACKING_URI: http://0.0.0.0:5000
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    networks: [devinsight]

  # Optional ETL scheduler. Start with:
  #   docker compose --profile airflow up -d
  scheduler:
    image: apache/airflow:2.9.3-python3.11
    container_name: devinsight-scheduler
    profiles: [airflow]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &airflow_env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-devinsight}:${POSTGRES_PASSWORD:-devinsight}@db:5432/${POSTGRES_DB:-devinsight}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 60
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__SECRET_KEY: ${SECRET_KEY:-devinsight-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-devinsight}:${POSTGRES_PASSWORD:-devinsight}@db:5432/${POSTGRES_DB:-devinsight}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PYTHONPATH: /opt/airflow/etl:/opt/airflow/ml
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./ml:/opt/airflow/ml:ro
      - ./backend:/opt/airflow/backend:ro
      - airflow_data:/root/airflow
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username ${AIRFLOW_ADMIN_USER:-admin}
                 --password ${AIRFLOW_ADMIN_PASSWORD:-admin} --role Admin
                 --email admin@devinsight.local || true) &&
               airflow scheduler"
    networks: [devinsight]

  mlflow-ui:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    container_name: devinsight-mlflow-ui
    profiles: [experiments]
    depends_on: [mlflow]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "5001:5000"
    networks: [devinsight]

volumes:
  db_data:
  etl_data:
  ml_artifacts:
  ml_reports:
  mlflow_data:
  airflow_data:

networks:
  devinsight:
    driver: bridge
