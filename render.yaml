services:
  - type: web
    name: devinsight-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./docker/backend.Dockerfile
    dockerCommand: /usr/local/bin/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: devinsight-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://devinsight-web.onrender.com
      - key: LOG_JSON
        value: "true"

  - type: web
    name: devinsight-web
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: devinsight-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: devinsight-db
    plan: free
    region: oregon
    databaseName: devinsight
    user: devinsight
    ipAllowList: []
