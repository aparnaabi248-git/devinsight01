[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devinsight-backend"
version = "1.0.0"
description = "DevInsight — AI-powered software engineering analytics and predictive intelligence"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
  "PyJWT>=2.9.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1.0",
]

[project.optional-dependencies]
ml = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scipy>=1.13.0",
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0",
  "joblib>=1.4.0",
  "mlflow-skinny>=2.17.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 95
target-version = "py311"
exclude = [".venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes — catches undefined names and repeated dict keys
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
]
ignore = [
  "E501",    # line length is handled by the formatter
  "E741",    # `l` is a conventional label in taxonomy regexes
  "B008",    # FastAPI's Depends() in defaults is idiomatic
  "B905",    # zip(strict=) is unnecessary: these sequences are aligned by construction
  "UP042",   # str + Enum is used deliberately so JSON serialises to the readable value
  "SIM115",  # long-lived caches use explicit open/close
  "BLE001",  # a broad except is correct at process boundaries (HTTP, training sweeps)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101", "C416"]
"alembic/*" = ["E402", "C416"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
