name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: staging

# Deployment only ever runs from the main branch or a tag, never a fork.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: MLflow image metadata
        id: mlflow-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/mlflow
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          build-args: VITE_API_URL=/api
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push MLflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mlflow.Dockerfile
          push: true
          tags: ${{ steps.mlflow-meta.outputs.tags }}
          labels: ${{ steps.mlflow-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Docker Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ github.ref_name }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST is not configured; running a local smoke test instead."
            cp .env.example .env
            echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env
            docker compose up -d --build db api
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/api/health; then
                echo "Deployment health check passed."
                docker compose down
                exit 0
              fi
              sleep 4
            done
            echo "::error::Health check did not pass within 120s"
            docker compose logs --tail=100
            exit 1
          fi

          if [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Set DEPLOY_USER, DEPLOY_SSH_KEY, and DEPLOY_KNOWN_HOSTS when DEPLOY_HOST is configured."
            exit 1
          fi

          case "$IMAGE_TAG" in
            ""|*[!A-Za-z0-9_.-]*)
              echo "::error::IMAGE_TAG contains unsupported characters."
              exit 1
              ;;
          esac

          if [ -z "$IMAGE_PREFIX" ]; then
            echo "::error::IMAGE_PREFIX is empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -o IdentitiesOnly=yes -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/devinsight'
          scp -o IdentitiesOnly=yes -i ~/.ssh/id_deploy docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:devinsight/docker-compose.yml"

          ssh -o IdentitiesOnly=yes -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' IMAGE_PREFIX='$IMAGE_PREFIX' bash -s" <<'EOF'
            set -e
            cd ~/devinsight
            export IMAGE_TAG IMAGE_PREFIX
            docker compose pull api web mlflow
            docker compose run --rm api alembic upgrade head
            docker compose up -d --remove-orphans
            docker compose ps
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/api/health; then
                echo "Deployment health check passed."
                exit 0
              fi
              sleep 4
            done
            echo "Health check did not pass within 120s." >&2
            docker compose logs --tail=100
            exit 1
          EOF
          echo "Deployed $IMAGE_TAG to $DEPLOY_HOST"

      - name: Post-deploy smoke test
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          curl -fsS "${DEPLOY_URL:-http://localhost:8000}/api/health" || \
            echo "::warning::Remote smoke test skipped (DEPLOY_URL not set)"
