name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: staging

# Deployment only ever runs from the main branch or a tag, never a fork.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          build-args: VITE_API_URL=/api
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Docker Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST is not configured; running a local smoke test instead."
            cp .env.example .env
            echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env
            docker compose up -d --build db api
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/api/health; then
                echo "Deployment health check passed."
                docker compose down
                exit 0
              fi
              sleep 4
            done
            echo "::error::Health check did not pass within 120s"
            docker compose logs --tail=100
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
            set -e
            cd ~/devinsight
            git pull --ff-only
            export IMAGE_TAG=$IMAGE_TAG
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T db pg_isready -U devinsight
            for i in \$(seq 1 30); do
              if curl -fsS http://localhost:8000/api/health; then break; fi
              sleep 4
            done
            docker image prune -f
          EOF
          echo "Deployed $IMAGE_TAG to $DEPLOY_HOST"

      - name: Post-deploy smoke test
        run: |
          curl -fsS "${DEPLOY_URL:-http://localhost:8000}/api/health" || \
            echo "::warning::Remote smoke test skipped (DEPLOY_URL not set)"
